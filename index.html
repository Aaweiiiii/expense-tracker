<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="192x192" href="/expense-tracker/icon-192.png" />
    <link rel="apple-touch-icon" href="/expense-tracker/icon-192.png" />
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#b0cfdc" id="theme-color-meta" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="./manifest.json" />
    <title>消费记录</title>
    <script type="module" crossorigin src="/expense-tracker/assets/index-SZGnuGmx.js"></script>
    <link rel="stylesheet" crossorigin href="/expense-tracker/assets/index-DfyZzuvo.css">
  </head>
  <body>
    <div id="root"></div>
    <div id="safe-diag" style="position:fixed;top:0;left:0;right:0;z-index:9999;background:rgba(0,0,0,0.85);color:#0f0;font:12px monospace;padding:6px 10px;pointer-events:none;line-height:1.6;"></div>
    <script>
      (function() {
        var el = document.getElementById('safe-diag');
        function update() {
          var probe = document.createElement('div');
          probe.style.cssText = 'position:fixed;bottom:0;left:0;width:0;height:0;padding-bottom:env(safe-area-inset-bottom);pointer-events:none;';
          document.body.appendChild(probe);
          var envB = probe.offsetHeight;
          document.body.removeChild(probe);
          var probe2 = document.createElement('div');
          probe2.style.cssText = 'position:fixed;top:0;left:0;width:0;height:0;padding-top:env(safe-area-inset-top);pointer-events:none;';
          document.body.appendChild(probe2);
          var envT = probe2.offsetHeight;
          document.body.removeChild(probe2);
          el.innerHTML =
            'safe-top:<b>'+envT+'</b> safe-bot:<b>'+envB+'</b> | '+
            'innerH:<b>'+window.innerHeight+'</b> vvp:<b>'+(window.visualViewport?window.visualViewport.height:'N/A')+'</b> | '+
            'screenH:<b>'+screen.height+'</b> standalone:<b>'+matchMedia('(display-mode: standalone)').matches+'</b>';
        }
        update();
        window.addEventListener('resize', update);
        window.visualViewport && window.visualViewport.addEventListener('resize', update);
      })();
    </script>
  </body>
</html>
